name: Build SYS22 Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SYS22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/SYS22-v2.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYS22-v2.4.0-APK
          path: release-output/SYS22-v2.4.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.4.0
          name: "SYS22 v2.4.0 - Advanced Bidirectional Web & Cloud Sync Edition"
          make_latest: true
          body: |
            ### ⚡ SYSTEM 22: Advanced Bidirectional Cloud & Web Sync Edition (v2.4.0)

            - **Advanced Web & Mobile Parity Synchronization (Brotherhood Architecture):**
              - **Zero-Lag Background Resume Sync:** Automatically checks Firestore parity via instant REST fetch whenever the app returns to foreground from background (`onResume`), bypassing dormant WebSocket delays.
              - **Smart Non-Destructive Merging:** Intelligent union and state preservation for Tasks, Critical Targets (Exams), Rules, and Notes so changes made on the web and mobile never overwrite each other.
              - **Zero-Delay Native Alarm Scheduling:** Hooks real-time cloud updates directly into Android's native AlarmManager without debounce delays, ensuring exam countdowns and task alarms are 100% synchronized.
              - **Dedicated Cloud Synchronizer Dashboard:** Full control center in Settings with one-tap Master Sync (`[ ⚡ مزامنة فورية كاملة ]`), explicit Cloud Pull, and explicit Cloud Push.
              - **Tactical Real-Time Status Pill:** Header badge in mobile view showing live sync state (`🟢 SYNCED`, `🔄 SYNCING`, `⚠️ ERROR`) and exact time of last synchronization.
            - **All Previous Innovations Maintained:**
              - Daily Tactical Wisdom Notification Engine (Today's Wisdom / حكمة اليوم) at 07:00 AM.
              - Official Satoru Gojo ('Nah, I'd win') launcher icon and notification art.
              - Permanent production keystore signing (`sys22-release.jks`) for seamless zero-uninstall updates.
              - In-app OTA update engine with one-click APK download and installation.
              - Moroccan Academic Calendar integration with automatic holiday schedules.
              - Privacy-first zero hardcoded secrets architecture with initial Firebase API Key setup modal.
          files: release-output/SYS22-v2.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
