name: Build SYS22 Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SYS22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/SYS22-v2.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYS22-v2.1.0-APK
          path: release-output/SYS22-v2.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "SYS22 v2.1.0 - Focused & Decluttered Mobile Edition"
          body: |
            ### ⚡ SYSTEM 22: Focused & Decluttered Edition (v2.1.0)

            - **Zero Spam & Focused Notifications:**
              - **Essential Exam Alerts Only:** 1 day before (D-1) and 30 minutes before exam time. No repetitive noise.
              - **Exact Task Reminders:** Alerts triggered ONLY for user tasks at their exact scheduled time.
              - **No Routine/Timetable Clutter:** Removed background school bells, wake-up spam, and evening checks.
              - **Notification Bar Hygiene:** Auto-timeout after 45 minutes and unified notification slot to prevent notification drawer clutter.
              - **Optimized Battery & Performance:** Eliminated recursive scheduling loops.
              - **Bidirectional Native Bridge:** Real-time synchronization between the React web app and Android native engines via `SYS22NativeBridge`.
            - **High-Performance Native Android App:**
              - Fast, lightweight standalone APK (~5 MB).
              - AMOLED Void dark theme `#030712` with matching system status and navigation bars.
            - **Secure Origin Assets & Offline Support:**
              - Built with `WebViewAssetLoader` serving local assets from `https://appassets.androidplatform.net/`.
              - 100% offline persistence using local storage and bundled JetBrains Mono typography.
              - Live Firebase cloud sync enabled when connected to the internet.
            - **Native Device Features:**
              - Hardware-accelerated GPU layer with zero white flash on launch.
              - Full File Chooser integration for JSON Backup & Restore.
              - Audio playback enabled for Deep Work and timer beeps.
              - Double back-tap navigation.
          files: release-output/SYS22-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
