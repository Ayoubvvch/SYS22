name: Build SYS22 Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SYS22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/SYS22-v2.2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYS22-v2.2.1-APK
          path: release-output/SYS22-v2.2.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.1
          name: "SYS22 v2.2.1 - Custom Gojo Launcher Icon Edition"
          make_latest: true
          body: |
            ### ⚡ SYSTEM 22: Custom Gojo Launcher Icon Edition (v2.2.1)

            - **New Custom Launcher Icon ("Nah, I'd Win"):**
              - High-resolution Satoru Gojo custom icon with glowing cyan/blue eyes and iconic smirk.
              - Full adaptive icon integration (`mipmap-anydpi-v26`) with safe-zone calibration so circular, squircle, and round launchers display the artwork cleanly.
              - Complete raster density buckets: `mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi` (standard & round icons).
              - High-res Play Store asset (512x512) and web favicon included.
            - **Notification Heads-Up Icon Enhancement:**
              - Notifications now display the custom icon as the large icon next to task & exam alerts.
            - **All Core Features Preserved:**
              - Permanent production keystore signing (`sys22-release.jks`) for seamless zero-uninstall updates.
              - In-app OTA update engine with one-click installation.
              - Moroccan Academic Calendar integration with automatic holiday schedules.
              - Privacy-first zero hardcoded secrets architecture with initial Firebase API Key setup modal.
          files: release-output/SYS22-v2.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
