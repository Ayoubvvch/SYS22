name: Build SYS22 Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SYS22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/SYS22-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYS22-v2.0.0-APK
          path: release-output/SYS22-v2.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "SYS22 v2.0.0 - 100% Mobile Integrated Edition"
          body: |
            ### ⚡ SYSTEM 22: 100% Mobile Integrated Edition (v2.0.0)

            - **Full Android System & Notification Integration:**
              - **Tiered Exam Countdowns:** Automated smart notifications at D-7, D-3, D-1, T-2h, and T-30m before any Critical Target / Exam.
              - **Timetable & Class Alerts:** 10-minute warning before every recurring class or scheduled block.
              - **Discipline & Sleep Protocols:** Automatic alerts for morning wake-up rules and evening wind-down cycles.
              - **Doze Mode Bypass:** Utilizes `AlarmManager.setExactAndAllowWhileIdle()` to guarantee precise triggers even during deep phone sleep.
              - **Boot Survival:** Native `BootReceiver` automatically restores all alarms after phone restart or OS updates.
              - **Interactive Notification Actions:** One-tap [Snooze 15m] and [Dismiss] straight from the Android status bar.
              - **Bidirectional Native Bridge:** Real-time synchronization between the React web app and Android native engines via `SYS22NativeBridge`.
            - **High-Performance Native Android App:**
              - Fast, lightweight standalone APK (~5 MB).
              - AMOLED Void dark theme `#030712` with matching system status and navigation bars.
            - **Secure Origin Assets & Offline Support:**
              - Built with `WebViewAssetLoader` serving local assets from `https://appassets.androidplatform.net/`.
              - 100% offline persistence using local storage and bundled JetBrains Mono typography.
              - Live Firebase cloud sync enabled when connected to the internet.
            - **Native Device Features:**
              - Hardware-accelerated GPU layer with zero white flash on launch.
              - Full File Chooser integration for JSON Backup & Restore.
              - Audio playback enabled for Deep Work and timer beeps.
              - Double back-tap navigation.
          files: release-output/SYS22-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
