name: Build SYS22 Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SYS22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/SYS22-v2.3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYS22-v2.3.0-APK
          path: release-output/SYS22-v2.3.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.0
          name: "SYS22 v2.3.0 - Daily Tactical Wisdom & Rules Edition"
          make_latest: true
          body: |
            ### ⚡ SYSTEM 22: Daily Tactical Wisdom & Rules Edition (v2.3.0)

            - **New Daily Wisdom Notification Engine (Today's Wisdom / حكمة اليوم):**
              - Automatically picks a rule, morning protocol, or tactical note from your personal **Rules (`s22_rules`)**, **Morning Protocol (`s22_morningRules`)**, or **Notes (`s22_patterns`)**.
              - Delivers an inspiring daily tactical notification every morning (7:00 AM) to kickstart your focus and discipline.
              - Dedicated notification channel (`sys22_wisdom_channel`) with amber/gold tactical accent (`#f59e0b`), Gojo custom large icon, and "تم الاستيعاب ✓" quick action.
              - Includes fallback to high-impact discipline & 2BAC principles if no custom notes/rules exist yet.
              - Includes an instant preview button in Settings: **`[ 📜 تجربة حكمة اليوم ]`**.
            - **All Core Features & Fixes Preserved:**
              - Custom Satoru Gojo adaptive launcher icon & notification card icon.
              - Permanent production keystore signing (`sys22-release.jks`) for seamless zero-uninstall updates.
              - In-app OTA update engine with one-click installation.
              - Moroccan Academic Calendar integration with automatic holiday schedules.
              - Privacy-first zero hardcoded secrets architecture with initial Firebase API Key setup modal.
          files: release-output/SYS22-v2.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
